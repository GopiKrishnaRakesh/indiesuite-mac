name: Pathway build

on:
  push:
    branches: [main]
    paths:
      - "file manager/**"
      - ".github/workflows/pathway-build.yml"
  pull_request:
    paths:
      - "file manager/**"
      - ".github/workflows/pathway-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Pathway.app
    runs-on: macos-15
    defaults:
      run:
        working-directory: file manager
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build (xcodegen + xcodebuild, ad-hoc signed)
        run: ./build.sh

      - name: Verify the app bundle was produced
        run: test -d "Build/Build/Products/Release/Pathway.app"
